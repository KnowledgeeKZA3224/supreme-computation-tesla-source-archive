name: Materialize Book PDFs

on:
  push:
    paths:
      - '.book-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild accessible PDF files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p books
          rebuild() {
            src="$1"
            out="$2"
            cat ".book-upload/${src}/"*.part | base64 -d | gzip -d > "books/${out}"
            test -s "books/${out}"
            head -c 5 "books/${out}" | grep -q '%PDF-'
          }
          rebuild Tesla Tesla.pdf
          rebuild Yahusha Yahusha.pdf
          rebuild Fard Fard.pdf
          rebuild How_the_Rose_Grew_Through_Concrete 'How the Rose Grew Through Concrete.pdf'
          rebuild Faraday Faraday.pdf
          rebuild Izm Izm.pdf
      - name: Remove transfer staging and commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .book-upload
          git config user.name 'Supreme Computation Archive Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A books .book-upload
          git commit -m 'Add accessible source-book PDFs' || exit 0
          git push
