name: Materialize Book PDFs

on:
  push:
    paths:
      - '.book-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild accessible PDF files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf books
          mkdir -p books
          cat .book-upload/archive/*.part | base64 -d > /tmp/supreme-computation-books.zip
          unzip -q /tmp/supreme-computation-books.zip -d books
          for f in \
            'Tesla.pdf' \
            'Yahusha.pdf' \
            'Fard.pdf' \
            'How the Rose Grew Through Concrete.pdf' \
            'Faraday.pdf' \
            'Izm.pdf'; do
              test -s "books/$f"
              head -c 5 "books/$f" | grep -q '%PDF-'
          done
      - name: Remove transfer staging and commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .book-upload
          git config user.name 'Supreme Computation Archive Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A books .book-upload
          git commit -m 'Add accessible source-book PDFs' || exit 0
          git push
